spring.application.name=Regression Test Suite Framework
server.port=8080

# MySQL datasource
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/automation_testing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Eswar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Quartz (will enable later via config)
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=10

# Centralized timeouts
timeouts.ui.pageLoad.seconds=90
timeouts.ui.elementWait.seconds=30
timeouts.ui.perTest.seconds=120
timeouts.api.request.seconds=15
timeouts.api.perTest.seconds=30
timeouts.run.global.seconds=0
